<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#243b53">
  <meta name="description" content="Registro local de transições e tempo de permanência por ambiente.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Tempo por ambiente</title>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <p class="eyebrow">REGISTRO DE CUSTÓDIA</p>
        <h1>Tempo por ambiente</h1>
      </div>
      <span id="offline-status" class="status">Offline disponível</span>
    </header>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Nova transição</h2>
      <form id="transition-form">
        <label for="environment">Quem está recebendo a criança?</label>
        <select id="environment" name="environment" required></select>

        <div class="field-grid">
          <div>
            <label for="date">Data</label>
            <input id="date" name="date" type="date" required>
          </div>
          <div>
            <label for="time">Hora</label>
            <input id="time" name="time" type="time" required>
          </div>
        </div>

        <label for="note">Nota <span class="optional">(opcional)</span></label>
        <textarea id="note" name="note" rows="2" maxlength="1000" placeholder="Observações sobre a transição"></textarea>

        <div class="form-footer">
          <p id="form-message" class="message" role="status" aria-live="polite"></p>
          <button type="submit">Adicionar</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="report-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">ACOMPANHAMENTO</p>
          <h2 id="report-title">Relatório de permanência</h2>
        </div>
        <button id="refresh-report" class="button-secondary" type="button">Atualizar</button>
      </div>
      <p id="report-period" class="report-period">Adicione a primeira transição para iniciar.</p>
      <div id="report-results" class="report-results"></div>
    </section>

    <section class="panel" aria-labelledby="history-title">
      <div class="section-heading">
        <h2 id="history-title">Histórico de transições</h2>
        <span id="event-count" class="count">0 registros</span>
      </div>
      <ol id="event-list" class="event-list">
        <li class="empty-state">Nenhuma transição registrada.</li>
      </ol>
    </section>

    <footer class="app-footer">Os dados ficam salvos somente neste navegador.</footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
